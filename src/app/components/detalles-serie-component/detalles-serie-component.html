<div class="max-w-sm mx-auto mt-8 bg-white rounded-xl shadow-md overflow-hidden">
    <img src="{{serie.imagen}}" alt="{{serie.nombre}}"
        class="w-full h-64 object-cover">

    <div class="p-6 text-center space-y-3">
        <h1 class="text-2xl font-bold text-blue-950">
            {{serie.nombre}}
        </h1>

        <p class="text-slate-600 font-medium">
            IMDB: <span class="text-sky-600 font-bold">{{serie.puntuacion}}</span>
        </p>

        <a [routerLink]="['/personajesSerie/', serie.idSerie]"
            class="inline-block bg-sky-600 hover:bg-sky-700 text-white font-semibold px-6 py-2 rounded-lg transition-colors">
            Ver personajes
        </a>
    </div>
</div>
